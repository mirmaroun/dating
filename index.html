<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceptance</title>
</head>

<body>
    <div class="container">
        
        <img src="assets/mypic.jpg"></img>
        <!-- <div class="heart"></div> -->
        <h1>🌸 Will you go on a date with me? 🌸</h1>
        <h3>Please choose freely</h3>
        <div class="buttonyesno">
            <button class="button buttonyes" onclick="gotosecondpage()">Yes <span>❤</span></button>
            <button class="button buttonno">No &#128577;</button>
        </div>

    </div>
</body>

<script>
    function gotosecondpage() {
        window.location.href="https://mirmaroun.github.io/dating/Secondpage.html";
    }
</script>


</html>



<script>
    const btn = document.querySelector(".buttonno");
    const container = document.querySelector(".container");

    btn.addEventListener("mouseenter", () => {
        const maxX = container.clientWidth - btn.offsetWidth;
        const maxY = container.clientHeight - btn.offsetHeight;

        const x = Math.floor(Math.random() * maxX - 200);
        const y = Math.floor(Math.random() * maxY - 200);

        btn.style.left = x + "px";
        btn.style.top = y + "px";
    });
</script>
